version: "3.8"

# ============================================================
# News Aggregator — Kafka Infrastructure (Go services)
# ============================================================
# Usage:
#   docker compose up -d              # start everything
#   docker compose logs -f producer   # follow a service
# ============================================================

services:

  # ----------------------------------------------------------
  # Zookeeper
  # ----------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # Kafka Broker
  # ----------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ----------------------------------------------------------
  # Schema Registry (Avro)
  # ----------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:9093"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD

  # ----------------------------------------------------------
  # Kafka Connect
  # ----------------------------------------------------------
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:9093"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "kafka-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    command:
      - bash
      - -c
      - |
        confluent-hub install --no-prompt confluentinc/kafka-connect-jdbc:10.7.4
        confluent-hub install --no-prompt mongodb/kafka-connector:1.11.0
        /etc/confluent/docker/run

  # ----------------------------------------------------------
  # Kafka UI
  # ----------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on: [kafka, schema-registry]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

  # ----------------------------------------------------------
  # Topic initialisation
  # ----------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      for topic in \
        news.posts.created \
        news.posts.updated \
        news.comments.added \
        news.tags.trending \
        news.posts.normalized \
        news.tags.aggregated \
        news.tags.trending.hourly; do
        kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists \
          --topic $$topic --partitions 3 --replication-factor 1
      done
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists \
        --topic news.posts.dlq --partitions 1 --replication-factor 1 \
        --config retention.ms=604800000
      echo 'Topics ready:' && kafka-topics --bootstrap-server kafka:9093 --list
      "
    restart: "no"

  # ----------------------------------------------------------
  # Go Producer (builds from source)
  # ----------------------------------------------------------
  producer:
    build:
      context: .
      dockerfile: docker/Dockerfile.producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
    restart: "no"

  # ----------------------------------------------------------
  # Go Consumer Group 1 — PostgreSQL writer
  # ----------------------------------------------------------
  consumer-pg:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer_pg
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-master:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
      POSTGRES_DSN: postgres://news_user:news_pass@db-master:5432/news_db
    restart: unless-stopped

  # ----------------------------------------------------------
  # Go Consumer Group 2 — MongoDB enricher
  # ----------------------------------------------------------
  consumer-mongo:
    build:
      context: .
      dockerfile: docker/Dockerfile.consumer_mongo
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
      MONGO_URI: mongodb://news_app:app_password@mongodb:27017/news_aggregator
    restart: unless-stopped

  # ----------------------------------------------------------
  # Go Streams processor
  # ----------------------------------------------------------
  streams:
    build:
      context: .
      dockerfile: docker/Dockerfile.streams
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
    restart: unless-stopped

  # ----------------------------------------------------------
  # Go Connect deployer (one-shot)
  # ----------------------------------------------------------
  connect-deploy:
    build:
      context: .
      dockerfile: docker/Dockerfile.connect
    depends_on:
      - kafka-connect
    environment:
      CONNECT_URL: http://kafka-connect:8083
    restart: "no"

  # ----------------------------------------------------------
  # Databases (from existing project)
  # ----------------------------------------------------------
  db-master:
    image: postgres:16
    environment:
      POSTGRES_DB: news_db
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_pass
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./tmp.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - ./mongo-admin-init.js:/docker-entrypoint-initdb.d/01_admin.js:ro
      - ./mongo-init.js:/docker-entrypoint-initdb.d/02_init.js:ro
    ports:
      - "27017:27017"

networks:
  default:
    name: news-aggregator-network
