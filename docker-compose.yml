  # mongodb-secondary-2:
  #   image: mongo:7
  #   container_name: mongodb-secondary-2
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: mongopass
  #   ports:
  #     - "27019:27017"
  #   volumes:
  #     - mongodb_secondary2_data:/data/db
