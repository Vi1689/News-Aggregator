  #   command: 
  #     - bash
  #     - -c
  #     - |
  #       # Установить правильные права на файл ключа
  #       chmod 600 /opt/mongo-config/keyfile
  #       chown 999:999 /opt/mongo-config/keyfile
  #       exec mongod --auth --bind_ip_all --replSet rs0 --keyFile /opt/mongo-config/keyfile
  #   depends_on:
  #     - mongodb
  #   healthcheck:
  #     test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --quiet --username admin --password mongopass
  #     interval: 10s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - news-aggregator-network
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # GO SERVICES FROM KAFKA-GO
  # ============================================================

  # Kafka Producer (Go)
  kafka-producer:
    build:
      context: ./kafka-go
      dockerfile: docker/Dockerfile.producer
    container_name: kafka-producer
    networks:
      - news-aggregator-network
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
    restart: "no"

  # Kafka Consumer - PostgreSQL writer (Go)
  kafka-consumer-pg:
    build:
      context: ./kafka-go
      dockerfile: docker/Dockerfile.consumer_pg
    container_name: kafka-consumer-pg
    networks:
      - news-aggregator-network
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      db-master:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
      POSTGRES_DSN: postgres://news_user:news_pass@db-master:5432/news_db
    restart: unless-stopped

  # Kafka Consumer - MongoDB enricher (Go)
  kafka-consumer-mongo:
    build:
      context: ./kafka-go
      dockerfile: docker/Dockerfile.consumer_mongo
    container_name: kafka-consumer-mongo
    networks:
      - news-aggregator-network
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/news_aggregator?authSource=admin
    restart: unless-stopped

  # Kafka Streams Processor (Go)
  kafka-streams:
    build:
      context: ./kafka-go
      dockerfile: docker/Dockerfile.streams
    container_name: kafka-streams
    networks:
      - news-aggregator-network
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
    restart: unless-stopped

  # Kafka Connect Deployer (Go)
  kafka-connect-deploy:
    build:
      context: ./kafka-go
      dockerfile: docker/Dockerfile.connect
    container_name: kafka-connect-deploy
    networks:
      - news-aggregator-network
    depends_on:
      - kafka-connect
    environment:
      CONNECT_URL: http://kafka-connect:8083
    restart: "no"

  # ============================================================
  # YOUR EXISTING SERVICES
  # ============================================================
  
  # Go сервер вместо C++
  server:
    build:
      context: ./server-go
      dockerfile: Dockerfile
    container_name: news-server-go
    networks:
      - news-aggregator-network
    depends_on:
      redis:
        condition: service_healthy
      db-master:
        condition: service_healthy
      db-replica:
         condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # - MONGODB_URI=mongodb://news_app:app_password@mongodb:27017/news_aggregator?authSource=news_aggregator
      - POSTGRES_MASTER=host=db-master port=5432 dbname=news_db user=news_user password=news_pass sslmode=disable
      - POSTGRES_REPLICA=host=db-replica port=5432 dbname=news_db user=news_user password=news_pass sslmode=disable
      - REDIS_ADDR=redis:6379
    ports:
      - "8085:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Опционально: researcher-vk
  researcher-vk:
    build:
      context: .
      dockerfile: ./researchers/vk/Dockerfile
    container_name: vk-researcher
    networks:
      - news-aggregator-network
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - ./config/researchers.xml:/usr/local/etc/vk-researcher/test_conf.xml
      - ./researchers/vk/access_token:/usr/local/etc/vk-researcher/access_token
    restart: unless-stopped

  researcher-reddit:
    build:
      context: .
      dockerfile: ./researchers/reddit/Dockerfile
    networks:
      - news-aggregator-network
    depends_on:
      server:
        condition: service_started
    volumes:
      - ./config/researchers.xml:/usr/local/etc/reddit-researcher/test_conf.xml
      - ./researchers/reddit/access_data:/usr/local/etc/reddit-researcher/access_data
      - ./researchers/reddit/token_cache.json:/usr/local/etc/reddit-researcher/token_cache.json

  data-generator:
    build:
      context: ./data-generator
      dockerfile: Dockerfile
    container_name: data-generator
    networks:
      - news-aggregator-network
    depends_on:
      server:
        condition: service_healthy
    environment:
      - API_URL=http://server:8080
      - BATCH_SIZE=3
      - DELAY_BETWEEN_RUNS=45
      - MAX_CYCLES=0
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://server:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # Backup сервис
  backup:
    build:
      context: ./backups
      dockerfile: Dockerfile
    container_name: postgres-backup
    networks:
      - news-aggregator-network
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_pass
    volumes:
      - ./backups:/backups
      - ./db:/db:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db-master:
        condition: service_healthy
      db-replica:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:enterprise
    container_name: neo4j
    networks:
      - news-aggregator-network
    ports:
      - "7474:7474"  
      - "7687:7687"
      - "2004:2004" 
    
    environment:
      - NEO4J_AUTH=neo4j/test12345
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      
      - NEO4J_server_metrics_enabled=true
      - NEO4J_server_metrics_prometheus_enabled=true
      - NEO4J_server_metrics_prometheus_endpoint=0.0.0.0:2004

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./import:/var/lib/neo4j/import
      - ./db/init_full_neo4j.cypher:/init/init.cypher:ro
      - ./backups:/backups
    
    command: ["neo4j", "console"]

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "test12345", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  neo4j-init:
    image: neo4j:enterprise
    container_name: neo4j-init
    networks:
      - news-aggregator-network
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./db/init_full_neo4j.cypher:/init.cypher:ro
    command: |
      bash -c "
      echo '========================================='
      echo '    NEO4J INITIALIZATION SERVICE'
      echo '========================================='
      
      echo '⏳ Waiting for Neo4j...'
      sleep 15
      
      echo '🚀 Running initialization script...'
      
      if cypher-shell -u neo4j -p test12345 -a bolt://neo4j:7687 -f /init.cypher; then
        echo ''
        echo '✅ Initialization completed!'
        echo ''
        echo '📊 Statistics:'
        cypher-shell -u neo4j -p test12345 -a bolt://neo4j:7687 '
          MATCH (u:User) RETURN \"Users: \" + count(u)
          UNION ALL
          MATCH (a:Author) RETURN \"Authors: \" + count(a)
          UNION ALL
          MATCH (art:Article) RETURN \"Articles: \" + count(art)
          UNION ALL
          MATCH ()-[r]->() RETURN \"Relationships: \" + count(r)
        '
      else
        echo '❌ Initialization failed!'
        exit 1
      fi
      "
    restart: "no"
  
volumes:
  postgres_master_data:
    driver: local
  postgres_replica_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  
