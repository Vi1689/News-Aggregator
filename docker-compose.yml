version: "3.8"

networks:
  news-aggregator-network:
    driver: bridge

services:
  # ============================================================
  # KAFKA INFRASTRUCTURE
  # ============================================================
  
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    hostname: zookeeper
    networks:
      - news-aggregator-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    networks:
      - news-aggregator-network
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # Schema Registry
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    networks:
      - news-aggregator-network
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:9093"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD

  # Kafka Connect
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    networks:
      - news-aggregator-network
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:9093"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "kafka-connect-group"
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    command:
      - bash
      - -c
      - |
        confluent-hub install --no-prompt confluentinc/kafka-connect-jdbc:10.7.4
        confluent-hub install --no-prompt mongodb/kafka-connector:1.11.0
        /etc/confluent/docker/run

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - news-aggregator-network
    depends_on: [kafka, schema-registry]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083

  # Topic initialisation
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    networks:
      - news-aggregator-network
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      for topic in \
        news.posts.created \
        news.posts.updated \
        news.comments.added \
        news.tags.trending \
        news.posts.normalized \
        news.tags.aggregated \
        news.tags.trending.hourly; do
        kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists \
          --topic $$topic --partitions 3 --replication-factor 1
      done
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists \
        --topic news.posts.dlq --partitions 1 --replication-factor 1 \
        --config retention.ms=604800000
      echo 'Topics ready:' && kafka-topics --bootstrap-server kafka:9093 --list
      "
    restart: "no"

  # ============================================================
  # DATABASES FROM YOUR PROJECT
  # ============================================================
  
  db-master:
    image: postgres:15
    container_name: postgres-master
    networks:
      - news-aggregator-network
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_pass
      POSTGRES_DB: news_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./db/tmp.sql:/docker-entrypoint-initdb.d/tmp.sql:ro
      - ./db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - postgres_master_data:/var/lib/postgresql/data
    command: |
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-replica:
    image: postgres:15
    container_name: postgres-replica
    networks:
      - news-aggregator-network
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_pass
      POSTGRES_DB: news_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./db/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    depends_on:
      db-master:
        condition: service_healthy
    command: |
      postgres
      -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d news_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # генерация ключа для mongodb
  # mongo-init:
  #   image: mongo:latest
  #   # profiles: ["init"]
  #   volumes:
  #     - mongo-keyfile:/opt/mongo-config
  #   command: >
  #     sh -c "
  #     openssl rand -base64 756 > /opt/mongo-config/keyfile &&
  #     chmod 600 /opt/mongo-config/keyfile &&
  #     chown 999:999 /opt/mongo-config/keyfile &&
  #     echo '✅ Keyfile generated' &&
  #     cat /opt/mongo-config/keyfile | base64
  #     "

  mongodb:
    image: mongo:7
    container_name: mongodb
    networks:
      - news-aggregator-network
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: news_aggregator
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./db/mongo-admin-init.js:/docker-entrypoint-initdb.d/01_admin.js:ro
      - ./db/mongo-init.js:/docker-entrypoint-initdb.d/02_init.js:ro
    command: mongod --auth --bind_ip_all
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/admin --quiet --username admin --password admin123
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  # mongodb-secondary-1:
  #   image: mongo:7
  #   container_name: mongodb-secondary-1
  #   environment:
  #     MONGO_INITDB_ROOT_USERNAME: admin
  #     MONGO_INITDB_ROOT_PASSWORD: mongopass
  #   ports:
  #     - "27018:27017"
  #   volumes:
  #     - mongodb_secondary1_data:/data/db
